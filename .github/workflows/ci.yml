
name: Hosting Lab CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Verify required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
